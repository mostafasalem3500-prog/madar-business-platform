<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم مدار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=11">
</head>
<body>
<div class="login-gate hidden" id="loginGate">
  <form id="loginForm" class="login-card">
    <span class="login-mark">م</span>
    <small>لوحة إدارة المنصة</small>
    <h1>مرحبًا بك في مَدار</h1>
    <p>سجّل الدخول لإدارة المنصة.</p>
    <label>كلمة المرور<input id="passwordInput" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
    <button class="btn primary" type="submit">دخول آمن</button>
    <em id="loginError"></em>
    <a href="/">← العودة إلى الموقع</a>
  </form>
</div>

<aside id="side" aria-label="أقسام لوحة التحكم">
  <a class="side-brand" href="/" target="_blank" rel="noopener"><span>م</span><div><b id="sideBrand">مَدار</b><small>لوحة التحكم الكاملة</small></div></a>
  <nav id="sideNav"></nav>
  <div class="side-foot">
    <div class="open-flag" id="openFlag" hidden>⚠ الدخول مفتوح بلا كلمة مرور</div>
    <a href="/" target="_blank" rel="noopener">↗ فتح الموقع</a>
    <button type="button" id="logoutBtn" hidden>↪ تسجيل الخروج</button>
  </div>
</aside>
<div class="side-scrim" id="sideScrim"></div>

<div class="shell">
  <header class="bar">
    <button type="button" class="icon-btn only-mobile" id="menuBtn" aria-label="القائمة">☰</button>
    <div class="bar-title"><small id="pageKicker">الإدارة المركزية</small><h1 id="pageTitle">لوحة القيادة</h1></div>
    <span class="save-state" id="saveState" data-state="saved">كل التغييرات منشورة</span>
    <button type="button" class="btn ghost" id="previewBtn" aria-pressed="false">◧ معاينة حية</button>
    <button type="button" class="btn primary" id="saveBtn" disabled>حفظ ونشر</button>
  </header>
  <div class="work" id="work">
    <main id="page" tabindex="-1"></main>
    <section class="preview" id="previewPane" hidden aria-label="معاينة الموقع">
      <div class="preview-bar">
        <b>معاينة قبل النشر</b>
        <div class="seg" role="group" aria-label="حجم الشاشة"><button type="button" data-device="desk" class="active">🖥</button><button type="button" data-device="tab">▭</button><button type="button" data-device="mob">📱</button></div>
        <button type="button" class="icon-btn" id="previewReload" title="إعادة تحميل">⟳</button>
      </div>
      <div class="frame-wrap" id="frameWrap"><iframe id="previewFrame" title="معاينة الموقع" src="about:blank"></iframe></div>
    </section>
  </div>
</div>

<div class="drawer" id="orderDrawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-scrim" data-close-drawer></div>
  <article class="drawer-card" id="drawerCard"></article>
</div>
<div class="toast" id="adminToast" role="status"></div>
<script src="cms-texts.js?v=1"></script>
<script src="admin.js?v=11"></script>
</body>
</html>
